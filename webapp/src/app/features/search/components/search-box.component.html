<div class="search-box-container">
  <div class="search-input-wrapper">
    <input
      #searchInput
      type="text"
      class="search-input"
      [value]="searchKeyword"
      (input)="onSearchInput($event)"
      (keydown)="onKeyDown($event)"
      (focus)="onFocus()"
      placeholder="搜尋人物、小說、事件或朝代"
      aria-label="搜尋金庸世界的人物、小說與事件"
      autocomplete="off"
    />
    @if (searchKeyword) {
      <button
        type="button"
        class="clear-button"
        (click)="clearSearch()"
        aria-label="清除搜尋"
        title="清除搜尋"
      >
        ✕
      </button>
    }
    @if (isSearching) {
      <span class="search-loading" aria-live="polite" aria-atomic="true">
        搜尋中...
      </span>
    }
  </div>
</div>
