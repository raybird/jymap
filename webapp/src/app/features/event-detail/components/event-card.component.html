<div class="event-card" *ngIf="event">
  @if (canGoBack) { <button type="button" class="exploration-back" (click)="back.emit()">← 返回上一個探索位置</button> }
  <div class="card-header">
    <div class="header-left">
      <div class="dynasty-badge">{{ getDynastyText(event) }}</div>
      <h3>{{ event.title }}</h3>
    </div>
    <button type="button" aria-label="關閉事件詳情" class="close-btn" (click)="close.emit()">✕</button>
  </div>

  <div class="card-meta">
    <span class="year">{{ getTimeText(event) }}</span>
    <span class="novel">{{ event.novel }}</span>
  </div>

  <div class="card-body">
    <div class="section">
      <h4>歷史事件</h4>
      <p>{{ event.description }}</p>
    </div>

    <div class="section" *ngIf="event.summary">
      <h4>小說情節</h4>
      <p class="summary">{{ event.summary }}</p>
    </div>

    <div class="section" *ngIf="event.characters.length > 0">
      <h4>相關人物</h4>
      <div class="characters">
        <button type="button" class="tag tag-character"
                *ngFor="let c of event.characters"
                (click)="onCharacterClick(c)"
                [attr.aria-label]="'查看 ' + c + ' 的軌跡'">
          追蹤 {{ c }}
        </button>
      </div>
    </div>

    <div class="section" *ngIf="event.sources.length > 0">
      <h4>資料來源</h4>
      <ul class="sources">
        <li *ngFor="let src of event.sources">
          <a [href]="src" target="_blank" rel="noopener">{{ src }}</a>
        </li>
      </ul>
      <p class="no-source" *ngIf="event.sources.length === 0">⚠ 資料來源缺失</p>
    </div>

    <div class="section related-section" *ngIf="relatedEvents.length > 0">
      <h4>繼續探索</h4>
      <div class="related-list">
        <button type="button" class="related-item" *ngFor="let re of relatedEvents" (click)="onRelatedClick(re.event)">
          <span class="rel-title">{{ re.event.title }}</span>
          <span class="rel-reason">{{ re.reasons.join(' · ') }}</span>
          <span class="rel-meta">{{ getDynastyText(re.event) }} · {{ getTimeText(re.event) }} · {{ re.event.novel }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
